on: [push, pull_request]

name: build

jobs:
  build-theory:
    name: Proof Check 
    runs-on: ubuntu-latest
    strategy:
        matrix:
            coq_version:
                - '8.20'
            ocaml_version: ['default']
        fail-fast: false
    steps:
        - uses: actions/checkout@v6
        - uses: coq-community/docker-coq-action@v1
          with:
            opam_file: 'Code/coq-spec-monad.opam'
            coq_version: ${{ matrix.coq_version }}
            ocaml_version: ${{ matrix.ocaml_version }}
            export: 'OPAMWITHTEST'
          env:
            OPAMWITHTEST: 'true'

  layers:
    name: Directory layers
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - run: python3 Code/scripts/depgraph.py --coqdep none --check-layers
